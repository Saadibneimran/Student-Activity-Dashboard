<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Activity Dashboard</title>

  <!-- Tailwind Css -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class"
    };
  </script>

  <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 transition-colors duration-300 dark:bg-slate-950 dark:text-slate-100">

  <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">

    <!-- Header -->
    <header class="mb-8 flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <p class="mb-2 text-sm font-semibold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">
          Student Management
        </p>
        <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">
          Student Activity Dashboard
        </h1>
        <p class="mt-2 max-w-2xl text-slate-600 dark:text-slate-400">
          Use this dashboard to manage student activities: add students, search them,
          change their status, and remove them.
        </p>
      </div>

      <button id="themeBtn"
        type="button"
        class="theme-btn rounded-xl border border-slate-200 bg-white px-4 py-2.5 font-semibold shadow-sm transition hover:-translate-y-0.5 hover:shadow-md dark:border-slate-700 dark:bg-slate-900">
        🌙 Dark Mode
      </button>
    </header>
